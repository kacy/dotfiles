# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -s set-clipboard on                   # copy to the system clipboard via OSC 52
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi

set -g prefix2 C-a                        # GNU Screen compatible prefix
bind C-a send-prefix -2

# edit configuration
bind e new-window -n tmux.conf "sh -c '\${EDITOR:-vim} ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf && tmux display \"tmux.conf sourced\"'"

# reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf sourced'


# -- display -------------------------------------------------------------------

set -g base-index 1                       # start window numbering at 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
setw -g clock-mode-style 24

set -g monitor-activity on
set -g visual-activity off

# clear both screen and history
bind -n C-l send-keys C-l \; clear-history


# -- theme ---------------------------------------------------------------------

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39
set -g display-panes-active-colour colour39
set -g display-panes-colour colour39
set -g message-style fg=colour16,bg=colour226,bold
setw -g mode-style fg=colour16,bg=colour226,bold
setw -g clock-mode-colour colour39

set -g status-style fg=colour253,bg=colour232
set -g status-justify left
set -g status-left-length 32
set -g status-left '#[fg=colour16,bg=colour226,bold] ❐ #S #[default] '
setw -g window-status-format ' #I #W '
setw -g window-status-current-format '#[fg=colour16,bg=colour39,bold] #I #W #[default]'
setw -g window-status-activity-style underscore
set -g status-right-length 64
set -g status-right '#[fg=colour245] %R  %d %b #[fg=colour254,bg=colour160] #(whoami) #[fg=colour16,bg=colour254,bold] #h '


# -- navigation ----------------------------------------------------------------

bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# split windows, keeping the current path
bind '"' split-window -h -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind % split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U
bind + resize-pane -Z                     # toggle pane zoom

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind Space last-window

bind m set -g mouse \; display 'mouse: #{?mouse,on,off}'


# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode
bind b list-buffers
bind P choose-buffer

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line


# -- local ---------------------------------------------------------------------

source -q ~/.config/tmux/local.conf
